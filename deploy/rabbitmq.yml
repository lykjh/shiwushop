services:
  rabbitmq:
    image: rabbitmq:4.4.0-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shiwushop
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?missing}
      RABBITMQ_DEFAULT_VHOST: shiwushop
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  rabbitmq_data:
