server {
    listen 80;
    server_name _;
    client_max_body_size 11m;

    location ^~ /actuator/metrics {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
